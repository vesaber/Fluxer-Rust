name: Mirror to git.gay

on:
  push:
    branches: [ "main" ]

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.CODEBERG_SSH_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          mkdir -p ~/.ssh
          ssh-keyscan git.gay >> ~/.ssh/known_hosts

      - name: Push mirror to git.gay
        run: |
          git remote add gitgay ssh://git@git.gay/vesaber/Fluxer-Rust.git
          git push gitgay '+refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
